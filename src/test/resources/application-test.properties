# Profile "test": banco H2 em memória (modo PostgreSQL) — não depende do Docker nem de variáveis de ambiente
spring.datasource.url=jdbc:h2:mem:visto_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

visto.jwt.secret=segredo-somente-para-testes-0123456789abcdefghij
visto.jwt.expiracao-ms=3600000
