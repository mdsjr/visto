spring.application.name=visto

# ---- Banco (PostgreSQL via docker-compose) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/visto}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:visto}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:visto123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
# Em produção, defina VISTO_JWT_SECRET (mínimo 32 caracteres para HS256).
visto.jwt.secret=${VISTO_JWT_SECRET:visto-dev-secret-troque-em-producao-0123456789abcdef}
# 24 horas
visto.jwt.expiracao-ms=${VISTO_JWT_EXPIRACAO_MS:86400000}

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
